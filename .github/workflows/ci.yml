name: Continuous Integration
# Deploy workflow is triggered from petly_pavlo after Azure secrets are configured.

on:
  push:
    branches:
      - main
      - petly_pavlo
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'AppCode/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - petly_pavlo
    paths:
      - 'AppCode/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: AppCode/Petly/Petly.csproj
  TEST_PROJECT_PATH: AppCode/Petly.Tests/Petly.Tests.csproj
  PUBLISH_DIR: ${{ github.workspace }}/published-app

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        run: dotnet restore $TEST_PROJECT_PATH

      - name: Build testable solution
        run: dotnet build $TEST_PROJECT_PATH --configuration Release --no-restore

      - name: Run tests
        run: dotnet test $TEST_PROJECT_PATH --configuration Release --no-build --verbosity normal

      - name: Publish web app
        run: dotnet publish $PROJECT_PATH --configuration Release --no-restore --output "$PUBLISH_DIR"

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: petly-webapp
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/petly_pavlo'
    runs-on: ubuntu-latest
    needs: build-test-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: petly-webapp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A6379D8DB3CC40B7ADB9D681F34E71D8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_50D96EEBE7EA4CC7BC36133E64F93DCB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_312BF5CB8E8F4540834BDDCE93CEA1F1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'petly-5-pavlo'
          slot-name: 'Production'
          package: .
